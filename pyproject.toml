[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinystats"
version = "0.1.0"
description = "Small summary statistics, built by a team to practice Git, TDD, and CI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/tinystats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tinystats"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
